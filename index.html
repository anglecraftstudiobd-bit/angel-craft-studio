
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel Craft Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff8fb;color:#49313d}
header{background:white;padding:18px;text-align:center}
header h1{color:#d85b91;margin:5px}
nav{background:#f9dce9;padding:13px;text-align:center}
nav a{margin:8px;color:#71334e;text-decoration:none;font-weight:bold}
.hero{text-align:center;padding:55px 15px;background:#ffe8f1}
.hero h2{color:#c64d83;font-size:30px}
button{background:#d85b91;color:white;border:0;padding:11px 18px;border-radius:20px;cursor:pointer}
input{padding:12px;border:1px solid #e9b6cc;border-radius:10px;width:90%;max-width:400px}
section{padding:25px 15px;text-align:center}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}
.product{background:white;padding:15px;border-radius:15px;box-shadow:0 2px 10px #f1dce5}
.product img{width:100%;height:130px;object-fit:cover;border-radius:10px}
.price{color:#d34e88;font-weight:bold}
footer{background:#f9dce9;padding:25px;text-align:center}
</style>
</head>
<body>
<header>
<h1>🪽 Angel Craft Studio</h1>
<p>Handmade with Love ❤️</p>
</header>
<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#cart">Cart</a>
</nav>
<div class="hero" id="home">
<h2>Welcome to Angel Craft Studio</h2>
<p>Beautiful Handmade Crafts, Made with Love.</p>
<button onclick="document.getElementById('products').scrollIntoView()">Shop Now</button>
</div>
<section id="products">
<h2>Our Collection 🌸</h2>
<input id="search" placeholder="Search products..." oninput="showProducts()">
<div class="products" id="productList"></div>
</section>
<section id="cart">
<h2>🛒 Shopping Cart</h2>
<div id="cartItems">Your cart is empty.</div>
<h3 id="total">Total: ৳0</h3>
<button onclick="orderNow()">Order on WhatsApp</button>
</section>
<footer>
<h3>Angel Craft Studio</h3>
<p>Handmade with Love, Just for You.</p>
<p>© 2026 Angel Craft Studio</p>
</footer>
<script>
const products=[
{name:"Handmade Craft 1",price:250,image:""},
{name:"Handmade Craft 2",price:350,image:""},
{name:"Handmade Craft 3",price:450,image:""}
];
let cart=[];
function showProducts(){
let q=document.getElementById('search').value.toLowerCase();
document.getElementById('productList').innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)).map((p,i)=>`
<div class="product">
<div style="font-size:55px">🎀</div>
<h3>${p.name}</h3>
<p class="price">৳${p.price}</p>
<button onclick="addCart('${p.name}')">Add to Cart</button>
</div>`).join('');
}
function addCart(name){
let p=products.find(x=>x.name===name);
cart.push(p);showCart();
}
function showCart(){
document.getElementById('cartItems').innerHTML=cart.length?cart.map(p=>p.name+' - ৳'+p.price).join('<br>'):'Your cart is empty.';
document.getElementById('total').innerText='Total: ৳'+cart.reduce((s,p)=>s+p.price,0);
}
function orderNow(){
if(!cart.length){alert('Your cart is empty!');return;}
let msg='Hello Angel Craft Studio! My Order:\n'+cart.map(p=>p.name+' ৳'+p.price).join('\n')+'\nTotal: ৳'+cart.reduce((s,p)=>s+p.price,0);
window.open('https://wa.me/8801XXXXXXXXX?text='+encodeURIComponent(msg),'_blank');
}
showProducts();
</script>
</body>
</html>
